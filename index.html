document.body.prepend(renderer.domElement);

const V = (x, y, z) => new THREE.Vector3(x, y, z);

function rr(x, X, Y, W, H, R) { x.beginPath(); x.moveTo(X + R, Y); x.arcTo(X + W, Y, X + W, Y + H, R); x.arcTo(X + W, Y + H, X, Y + H, R); x.arcTo(X, Y + H, X, Y, R); x.arcTo(X, Y, X + W, Y, R); x.closePath(); }

/* ---------- Ancoră + inimă (1 unitate model = 50 mm) ---------- */
const anchor = new THREE.Group(); anchor.position.set(0, 1.5, 0); scene.add(anchor);
const anchorTarget = anchor.position.clone();

const selectables = [];
const viewMats = [];   // {mat, anat:{opacity}, inter:{opacity}|null}
function vmat(mat, anatOp, interOp) { viewMats.push({ mat, anatOp, interOp }); return mat; }

/* ---------- Model anatomic (BodyParts3D) ---------- */
const KEY = {
  'right-atrium': 'RA', 'left-atrium': 'LA', 'ventricular-wall': 'VW', 'right-ventricle': 'RV', 'left-ventricle': 'LV',
  'ascending-aorta': 'AO', 'aortic-arch': 'AO', 'pulmonary-trunk': 'PT', 'superior-vena-cava': 'SVC',
  'left-coronary': 'LCA', 'right-coronary': 'RCA'
};
const CENTER = {
  RA: [-0.73, -0.28, 0.22], LA: [0.0, -0.14, -0.31], VW: [0.2, -0.45, 0.43],
  RV: [-0.027, -0.388, 0.634], LV: [0.276, -0.466, 0.126]
};
const pivots = {};
function pivot(key) {
  if (!pivots[key]) { const g = new THREE.Group(); g.position.set(...CENTER[key]); heart.add(g); pivots[key] = g; }
  return pivots[key];
}
function muscleMat(color) {
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.34, metalness: 0.05, envMapIntensity: 1.3, side: THREE.DoubleSide });
  m.onBeforeCompile = sh => { sh.fragmentShader = sh.fragmentShader.replace('#include <color_fragment>', '#include <color_fragment>\n  if (!gl_FrontFacing) diffuseColor.rgb *= vec3(0.75, 0.5, 0.48);'); };
  return m;
}
function vesselMat(color) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.42, metalness: 0.03, side: THREE.DoubleSide });
}

function buildModel(gltf) {
  gltf.scene.updateMatrixWorld(true);
  const meshes = [];
  gltf.scene.traverse(o => { if (o.isMesh) meshes.push(o); });
  for (const m of meshes) {
    const name = m.name in KEY ? m.name : m.parent?.name;
    const key = KEY[name]; if (!key) continue;
    m.matrixWorld.decompose(m.position, m.quaternion, m.scale);
    let parent = heart;
    if (key === 'RA' || key === 'LA' || key === 'RV' || key === 'LV') parent = pivot(key);
    else if (key === 'VW' || key === 'LCA' || key === 'RCA') parent = pivot('VW');
    if (parent !== heart) m.position.sub(parent.position);
    let mat;
    if (key === 'RA' || key === 'LA') mat = vmat(muscleMat(0x8e3129), 1, 0.16);
    else if (key === 'VW') mat = vmat(muscleMat(0x7f2621), 1, 0.13);
    else if (key === 'LCA' || key === 'RCA') { mat = new THREE.MeshStandardMaterial({ color: 0xc3362b, roughness: 0.3, envMapIntensity: 1.4 }); coronaryMeshes.push(m); }
    else if (key === 'RV' || key === 'LV') {
      mat = new THREE.MeshStandardMaterial({ color: key === 'RV' ? 0x3d55e0 : 0xe03a3a, transparent: true, opacity: 0.3, depthWrite: false, side: THREE.DoubleSide, roughness: 0.5 });
      cavityMeshes.push(m);
    }
    else if (key === 'SVC') mat = vmat(vesselMat(0x6b5288), 1, 0.22);
    else if (key === 'PT') mat = vmat(vesselMat(0xc49aa6), 1, 0.22);
    else mat = vmat(vesselMat(0xdcae9f), 1, 0.22);
    m.material = mat; m.userData.key = key; m.renderOrder = key === 'RV' || key === 'LV' ? 2 : 1;
    parent.add(m); selectables.push(m);
  }
}

/* Vase adăugate schematic (lipsesc din setul BodyParts3D folosit) */
function tube(key, pts, rad, color) {
  const curve = new THREE.CatmullRomCurve3(pts.map(p => V(...p)));
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, rad, 18, false), vmat(vesselMat(color), 1, 0.2));
  m.userData.key = key; heart.add(m); selectables.push(m);
}

  { ti: 'Privim înăuntru', t: 'Facem pereții transparenți. Albastru este sângele venos, roșu sângele oxigenat. Valvele se deschid și se închid la fiecare bătaie.', view: 'inter', hl: [] },
  { ti: 'Intrăm în inimă', t: 'Mărim inima de 24 de ori și încetinim totul de zece ori, ca să poți urmări fiecare fază a ciclului cardiac.', size: 'gigant', slow: true, focus: P_RA, hl: [] },
  { ti: 'Atriul drept', t: 'Ești în atriul drept. Sângele intră de sus prin vena cavă superioară și de jos prin vena cavă inferioară și se adună aici cât timp valva tricuspidă e închisă.', hl: ['SVC', 'IVC'], focus: P_RA },
  { ti: 'Valva tricuspidă', t: 'În fața ta, valva tricuspidă, cu trei cuspide. Se deschide în diastolă și se închide la începutul sistolei ventriculare: acesta este primul zgomot, S1.', hl: ['TV'], focus: P_TV },
  { ti: 'Ventriculul drept', t: 'Ventriculul drept se contractă și împinge sângele prin valva pulmonară spre plămâni. Valva pulmonară se deschide doar în faza de ejecție.', hl: ['RV', 'PUV'], focus: P_RV },
  { ti: 'Atriul stâng', t: 'Sângele se întoarce oxigenat de la plămâni, prin venele pulmonare, în atriul stâng.', hl: ['PV'], focus: P_LA },
  { ti: 'Valva mitrală', t: 'Valva mitrală are doar două cuspide. Închiderea ei, împreună cu a tricuspidei, produce S1 — imediat după complexul QRS de pe ECG.', hl: ['MV'], focus: P_MV },
  { ti: 'Ventriculul stâng', t: 'Ventriculul stâng are peretele cel mai gros: el pompează sângele în tot corpul, cu cea mai mare presiune.', hl: ['LV'], focus: P_LV },
  { ti: 'Valva aortică', t: 'Valva aortică se deschide în ejecție și se închide la sfârșitul sistolei: al doilea zgomot, S2, spre finalul undei T de pe ECG.', hl: ['AOV', 'AO'], focus: P_AOV },
  { ti: 'Final', t: 'Acesta a fost un ciclu cardiac complet. Acum poți explora singur, poți tăia inima cu „Secțiune” sau poți porni „Test”.', size: 'natural', slow: false, view: 'anatomic', hl: [] },
];
let tour = null;
function startTour() { if (exam) stopExam(); tour = { i: -1, id: 0 }; nextStep(1); }
function stopTour() { tour = null; speechStop(); setHighlight([]); setCaption('', ''); }
function nextStep(d) {
  if (!tour) return;
  tour.i = Math.max(0, tour.i + d); tour.id++;
  if (tour.i >= TOUR.length) { stopTour(); return; }
  const st = TOUR[tour.i], id = tour.id;
  if (st.view) { state.view = st.view; applyView(); }
  if ('slow' in st) state.slow = st.slow;
  if (st.size && st.size !== sizeMode) setSize(st.size); else if (st.size && !st.focus) setSize(st.size);
  if (st.focus) focusModel(st.focus);
  setHighlight(st.hl); select(null);
  setCaption(`${st.ti}  ·  ${tour.i + 1}/${TOUR.length}`, st.t, renderer.xr.isPresenting ? 'Atinge cardul → pasul următor' : '');
  const est = Math.max(6500, st.t.length * 75);
  tour.until = performance.now() + est * (roVoice && state.sound ? 1.8 : 1);
  speak(st.t, () => { if (tour && tour.id === id) tour.until = Math.min(tour.until, performance.now() + 1500); });
}

/* ---------- Test ---------- */
const QUIZ = [
  { q: 'Atinge atriul drept.', k: ['RA'], v: 'anatomic' },
  { q: 'Atinge ventriculul care are peretele cel mai gros.', k: ['LV'], v: 'inter' },
  { q: 'Atinge ventriculul care pompează sângele în circulația mică.', k: ['RV'], v: 'inter' },
  { q: 'Atinge valva care are doar două cuspide.', k: ['MV'], v: 'inter' },
  { q: 'Atinge valva a cărei închidere dă componenta A2 a zgomotului S2.', k: ['AOV'], v: 'inter' },
  { q: 'Atinge valva dintre atriul drept și ventriculul drept.', k: ['TV'], v: 'inter' },
  { q: 'Atinge valva prin care sângele pleacă spre plămâni.', k: ['PUV'], v: 'inter' },
  { q: 'Atinge vasul care duce sânge neoxigenat spre plămâni.', k: ['PT', 'PA'], v: 'anatomic' },
  { q: 'Atinge vasele care aduc sânge oxigenat în atriul stâng.', k: ['PV'], v: 'anatomic' },
  { q: 'Atinge artera coronară care irigă în principal ventriculul drept.', k: ['RCA'], v: 'anatomic' },
  { q: 'Atinge artera coronară din care pornește artera interventriculară anterioară.', k: ['LCA'], v: 'anatomic' },
  { q: 'Atinge vena care aduce sângele din cap și membrele superioare.', k: ['SVC'], v: 'anatomic' },
  { q: 'Atinge vena care aduce sângele din membrele inferioare.', k: ['IVC'], v: 'anatomic' },
  { q: 'Atinge vasul în care pompează ventriculul stâng.', k: ['AO', 'DAO'], v: 'anatomic' },
];
const NQ = 8;
let exam = null;
const nameOf = k => (INFO[k]?.[0] || 'nimic').replace(/ \((schematic|cavitate)\)/, '');
function startExam() {
  if (tour) stopTour();
  const order = QUIZ.map((_, i) => i).sort(() => Math.random() - 0.5).slice(0, NQ);
  exam = { order, i: -1, score: 0, t0: performance.now(), lock: false, done: false };
  select(null); setSize('mare'); applyView(); nextQ();
}
function stopExam() { exam = null; setHighlight([]); setCaption('', ''); applyView(); }
function nextQ() {
  if (!exam) return;
  exam.i++; exam.lock = false; setHighlight([]);
  if (exam.i >= exam.order.length) {
    exam.done = true;
    const sec = Math.round((performance.now() - exam.t0) / 1000), p = exam.score / exam.order.length;
    setCaption(`Rezultat: ${exam.score} / ${exam.order.length}`, `${p >= 0.875 ? 'Excelent!' : p >= 0.6 ? 'Bine!' : 'Mai exersează puțin.'} Timp: ${Math.floor(sec / 60)} min ${sec % 60} s. Apasă „Test: oprește” sau pornește-l din nou.`);
    tone(660, 0.15); tone(880, 0.15, 'sine', 0.25, 0.15); tone(1320, 0.3, 'sine', 0.25, 0.3);
    return;
  }
  const q = QUIZ[exam.order[exam.i]];
  state.view = q.v; applyView();
  setCaption(`Întrebarea ${exam.i + 1} / ${exam.order.length}  ·  scor ${exam.score}`, q.q);
}
function answer(key) {
  if (!exam || exam.lock || exam.done || !key) return;
  const q = QUIZ[exam.order[exam.i]], ok = q.k.includes(key), e = exam;
  e.lock = true;
  if (ok) {
    e.score++; setHighlight([key], GREEN); tone(880, 0.12); tone(1320, 0.2, 'sine', 0.25, 0.1); hapticAll(0.5, 60);
    setCaption(`Corect!  ·  scor ${e.score}`, `${nameOf(key)}. ${q.q.replace('Atinge ', '').replace(/\.$/, '')} — exact.`);
  } else {
    setHighlight([]); highlight.set(key, RED); for (const k of q.k) highlight.set(k, GREEN); emissiveDirty = true;
    tone(170, 0.28, 'square', 0.12); hapticAll(0.9, 150);
    setCaption(`Greșit  ·  scor ${e.score}`, `Ai atins: ${nameOf(key)}. Răspunsul corect (verde): ${nameOf(q.k[0])}.`);
  }
  setTimeout(() => { if (exam === e) nextQ(); }, ok ? 1600 : 3200);
}
function handleClick(key) { if (exam && !exam.done) answer(key); else select(key); }

/* ---------- WebXR ---------- */
const xrBtn = document.getElementById('xrbtn'), msg = document.getElementById('msg');
let xrMode = null, needPlace = false;
(async () => {
  if (navigator.xr) {
    try {
      if (await navigator.xr.isSessionSupported('immersive-ar')) xrMode = 'immersive-ar';
      else if (await navigator.xr.isSessionSupported('immersive-vr')) xrMode = 'immersive-vr';
    } catch (e) { }
  }
  if (xrMode) { xrBtn.disabled = false; xrBtn.textContent = xrMode === 'immersive-ar' ? 'Intră în AR' : 'Intră în VR'; }
  else {
    xrBtn.textContent = 'AR indisponibil';
    msg.textContent = 'Previzualizare 3D: rotește cu degetul sau mouse-ul, apropie cu pinch / rotiță. Pentru AR deschide pagina în browserul de pe Magic Leap 2.';
    setTimeout(() => { msg.textContent = ''; }, 9000);
  }
})();
xrBtn.onclick = async () => {
  ensureAudio();
  try {
    const s = await navigator.xr.requestSession(xrMode, { optionalFeatures: ['local-floor', 'hand-tracking'] });
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(s);
    scene.background = xrMode === 'immersive-ar' ? null : BG;
    panel.visible = true; needPlace = true; curScale = 0.002; document.body.classList.add('xr');
    s.addEventListener('end', () => {
      scene.background = BG; panel.visible = false; document.body.classList.remove('xr');
      if (grab) { grab.parent.attach(grab.obj); grab = null; }
      anchorTarget.set(0, 1.5, 0); anchor.position.copy(anchorTarget); anchor.quaternion.identity(); resetView();
    });
  } catch (e) {
    msg.textContent = 'Nu am putut porni sesiunea XR (' + (e.message || e) + '). Dacă pagina e deschisă într-un cadru (de ex. în claude.ai), deschide fișierul direct, de pe o adresă HTTPS.';
  }
};
resetView();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ---------- Încărcare model ---------- */
const bin = Uint8Array.from(atob(window.GLB_B64), c => c.charCodeAt(0)).buffer;
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
loader.parse(bin, '', gltf => { buildModel(gltf); applyView(); document.getElementById('loading').remove(); },
  err => { document.getElementById('loading').textContent = 'Eroare la încărcarea modelului: ' + err.message; });
applyView();

/* ---------- Bucla ---------- */
const clock = new THREE.Clock();
let panelAcc = 1;
function sc(key, s) { const g = pivots[key]; if (g) g.scale.setScalar(s); }
function step(dt) {
  const ts = state.paused ? 0 : (state.slow ? 0.1 : 1), sdt = dt * ts;
  simTime += sdt;
  while (simTime >= cycleStart + cycleDur) {
    cycleStart += cycleDur; cycleDur = newDur();
    beats.push({ s: cycleStart, d: cycleDur }); if (beats.length > 20) beats.shift();
    s1Done = s2Done = false;
  }
  phase = (simTime - cycleStart) / cycleDur;
  if (!s1Done && phase >= 0.19) { s1Done = true; thump(55, 0.14, 0.9); hapticAll(0.7, 70); flash('S1 – se închid mitrala și tricuspida'); }
  if (!s2Done && phase >= 0.5) { s2Done = true; thump(85, 0.09, 0.7); hapticAll(0.35, 40); flash('S2 – se închid valvele aortică și pulmonară'); }

  const at = state.afib ? 0 : (phase >= 0.08 && phase < 0.19 ? Math.sin(Math.PI * (phase - 0.08) / 0.11) : 0);
  const tremor = state.afib ? 0.012 * Math.sin(simTime * 2 * Math.PI * 6.1) + 0.008 * Math.sin(simTime * 2 * Math.PI * 8.9 + 1) : 0;
  const ve = smooth(0.19, 0.3, phase) * (1 - smooth(0.46, 0.58, phase));
  const sa = 1 - 0.07 * at + 0.025 * ve + tremor;
  sc('RA', sa); sc('LA', sa);
  sc('VW', 1 - 0.065 * ve);
  sc('RV', 1 - 0.18 * ve); sc('LV', 1 - 0.2 * ve);

  const ao = avOpen(phase), so = slOpen(phase);
  if (valveGroup.visible) for (const v of valves) setValve(v, v.type === 'av' ? lerp(-0.22, 1.3, ao) : lerp(-0.28, 1.4, so));
  if (inst.visible) updateParticles(sdt, ao > 0.5, so > 0.5);

  curScale += (targetScale - curScale) * Math.min(1, dt * 3); heart.scale.setScalar(curScale);
  if (!grab || grab.obj !== anchor) anchor.position.lerp(anchorTarget, Math.min(1, dt * (tour ? 1.6 : 3)));
}
let ecgAcc = 1, audioAcc = 1;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  step(dt);
  const xr = renderer.xr.isPresenting;
  updateEmissive(clock.elapsedTime);
  updateSection(xr);
  if (tour && performance.now() > tour.until) nextStep(1);
  updateCaption(dt, xr, needPlace);
  if (xr) {
    if (needPlace) { placeInXR(true); placePanel(); needPlace = false; }
    xrHover();
    ecgAcc += dt; if (ecgAcc > 1 / 20) { ecgAcc = 0; drawECGTex(); }
    const sig = panelSig() + '|' + (performance.now() < flashUntil);
    if (sig !== lastSig) { lastSig = sig; drawPanel(false); }
  } else {
    if (camGoal) { const k = Math.min(1, dt * 2.5); controls.target.lerp(camGoal.t, k); camera.position.lerp(camGoal.p, k); }
    controls.update();
    panelAcc += dt; if (panelAcc > 1 / 30) { panelAcc = 0; drawPanel(true); }
  }
  audioAcc += dt; if (audioAcc > 1 / 30) { audioAcc = 0; updateAudio(); }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
