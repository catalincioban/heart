<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =========================================================
   Renderer / scenă
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.localClippingEnabled = true;
renderer.xr.enabled = true;
renderer.xr.setFramebufferScaleFactor(0.85);
renderer.xr.setFoveation(0.8);
renderer.domElement.id = 'c3d';
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const BG = new THREE.Color(0x0b0f17);
scene.background = BG;
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.85;
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 0.05; controls.maxDistance = 15;
scene.add(new THREE.HemisphereLight(0xfff4ee, 0x2a3346, 0.9));
const dl = new THREE.DirectionalLight(0xffffff, 1.9); dl.position.set(1, 2, 2); scene.add(dl);

const V = (x, y, z) => new THREE.Vector3(x, y, z);

  sizeMode = m; targetScale = SIZES[m]; updateLabels(); uiDirty = true;
  if (xrOn()) placeInXR(false); else resetView();
}
function placeInXR(snap) {
  camPose();
  const dist = { natural: 0.5, mare: 0.85, gigant: 3.0 }[sizeMode], dy = { natural: -0.04, mare: -0.06, gigant: 0.1 }[sizeMode];
  anchorTarget.copy(_cp).addScaledVector(_cd, dist); anchorTarget.y = _cp.y + dy;
  anchor.quaternion.setFromAxisAngle(V(0, 1, 0), Math.atan2(-_cd.x, -_cd.z));
  if (snap) anchor.position.copy(anchorTarget);
}
function focusModel(p) {
  const off = V(...p).multiplyScalar(targetScale).applyQuaternion(heartQTarget);
  if (xrOn()) { camPose(); const W = _cp.clone().addScaledVector(_cd, sizeMode === 'gigant' ? 0.9 : 0.55); W.y = _cp.y - 0.05; anchorTarget.copy(W).sub(off.applyQuaternion(anchor.quaternion)); }
  else { const wp = V(0, 1.5, 0).add(off), back = sizeMode === 'gigant' ? 2.2 : 0.3; camGoal = { t: wp, p: wp.clone().add(V(0.15 * back, 0.15 * back, back)) }; }
}

/* =========================================================
   Tur ghidat (derulat manual)
   ========================================================= */
const P_RA = [-0.73, -0.28, 0.22], P_TV = [-0.5, -0.38, 0.45], P_RV = [-0.03, -0.39, 0.63], P_LA = [0.0, -0.14, -0.31], P_MV = [0.03, -0.3, -0.2], P_LV = [0.28, -0.47, 0.13], P_AOV = [-0.09, -0.13, 0.12];
const TOUR = [
  { ti: 'Bun venit', t: 'O inimă umană în mărime reală, reconstruită din date anatomice. Are cam cât pumnul tău și bate de aproximativ 100.000 de ori pe zi.', view: 'ext', size: 'natural', slow: false, hl: [] },
  { ti: 'Atriul drept', t: 'În partea dreaptă a inimii — în stânga ta — atriul drept primește sângele venos din tot corpul, prin venele cave.', hl: ['RA', 'SVC', 'IVC'] },
  { ti: 'Ventriculii', t: 'Dedesubt se află ventriculii, camerele care pompează sângele. Ventriculul stâng formează vârful inimii: apexul.', hl: ['VW'] },
  { ti: 'Arterele coronare', t: 'Arterele coronare, de pe suprafața inimii, irigă chiar mușchiul cardiac. Dacă una dintre ele se blochează, apare infarctul miocardic.', hl: ['LCA', 'RCA'] },
  { ti: 'Vasele mari', t: 'Sus pleacă aorta, spre tot corpul, și trunchiul pulmonar, spre plămâni. Cele două vase se încrucișează.', hl: ['AO', 'PT'] },
  { ti: 'Tăiem inima', t: 'Tăiem inima prin toate cele patru camere și o întoarcem spre tine. Interiorul e albastru în inima dreaptă (sânge venos) și roșu în inima stângă (sânge oxigenat). Bej: mușchiul tăiat.', view: 'sec', hl: [] },
  { ti: 'Intrăm în inimă', t: 'Mărim inima de 24 de ori și încetinim totul de zece ori, ca să urmărești fiecare fază a ciclului.', size: 'gigant', slow: true, focus: P_RA, hl: [] },
  { ti: 'Atriul drept', t: 'Sângele intră prin cele două vene cave și se adună aici cât timp valva tricuspidă e închisă.', hl: ['SVC', 'IVC', 'RA'], focus: P_RA },
  { ti: 'Valva tricuspidă', t: 'Are trei cuspide. Se deschide în diastolă și se închide la începutul sistolei ventriculare: primul zgomot, S1.', hl: ['TV'], focus: P_TV },
  { ti: 'Ventriculul drept', t: 'Se contractă și împinge sângele prin valva pulmonară spre plămâni. Valva pulmonară se deschide doar în ejecție.', hl: ['RV', 'PUV'], focus: P_RV },
  { ti: 'Atriul stâng', t: 'Sângele revine oxigenat de la plămâni, prin venele pulmonare, în atriul stâng.', hl: ['LA'], focus: P_LA },
  { ti: 'Valva mitrală', t: 'Are doar două cuspide. Închiderea ei, împreună cu a tricuspidei, produce S1 — imediat după complexul QRS de pe ECG.', hl: ['MV'], focus: P_MV },
  { ti: 'Ventriculul stâng', t: 'Are peretele cel mai gros, pentru că pompează sângele în tot corpul, la cea mai mare presiune.', hl: ['LV'], focus: P_LV },
  { ti: 'Valva aortică', t: 'Se deschide în ejecție și se închide la sfârșitul sistolei: al doilea zgomot, S2, spre finalul undei T.', hl: ['AOV', 'AO'], focus: P_AOV },
  { ti: 'Final', t: 'Ai parcurs un ciclu cardiac complet. Acum poți explora liber, poți tăia inima din meniu („Vedere”) sau poți porni testul.', size: 'natural', slow: false, view: 'ext', hl: [] },
];
let tour = null;
function startTour() { if (exam) stopExam(); tour = { i: -1 }; nextStep(1); }
function stopTour() { tour = null; speechStop(); setHighlight([]); setCaption('', ''); }
function nextStep(d) {
  if (!tour) return;
  tour.i = Math.max(0, tour.i + d);
  if (tour.i >= TOUR.length) { stopTour(); return; }
  const st = TOUR[tour.i];
  let view = 'ext', size = 'natural', slow = false;
  for (let j = 0; j <= tour.i; j++) { const s = TOUR[j]; if (s.view) view = s.view; if (s.size) size = s.size; if ('slow' in s) slow = s.slow; }
  if (view !== state.view) { state.view = view; applyView(); }
  state.slow = slow;
  if (size !== sizeMode || (tour.focused && !st.focus)) setSize(size);
  if (st.focus) focusModel(st.focus);
  tour.focused = !!st.focus;
  select(null); setHighlight(st.hl);
  setCaption(`${st.ti}  ·  ${tour.i + 1}/${TOUR.length}`, st.t);
  speak(st.t);
}

/* =========================================================
   Test
   ========================================================= */
const QUIZ = [
  { q: 'Atinge atriul drept.', k: ['RA'], v: 'ext' },
  { q: 'Atinge ventriculul cu peretele cel mai gros.', k: ['LV'], v: 'sec' },
  { q: 'Atinge ventriculul care pompează sângele în circulația mică.', k: ['RV'], v: 'sec' },
  { q: 'Atinge valva care are doar două cuspide.', k: ['MV'], v: 'sec' },
  { q: 'Atinge valva a cărei închidere dă componenta A2 a zgomotului S2.', k: ['AOV'], v: 'sec' },
  { q: 'Atinge valva dintre atriul drept și ventriculul drept.', k: ['TV'], v: 'sec' },
  { q: 'Atinge vasul care duce sânge neoxigenat spre plămâni.', k: ['PT', 'PA'], v: 'ext' },
  { q: 'Atinge vasele care aduc sânge oxigenat în atriul stâng.', k: ['PV'], v: 'ext' },
  { q: 'Atinge artera coronară care irigă în principal ventriculul drept.', k: ['RCA'], v: 'ext' },
  { q: 'Atinge artera coronară din care pornește artera interventriculară anterioară.', k: ['LCA'], v: 'ext' },
  { q: 'Atinge vena care aduce sângele din cap și membrele superioare.', k: ['SVC'], v: 'ext' },
  { q: 'Atinge vena care aduce sângele din membrele inferioare.', k: ['IVC'], v: 'ext' },
  { q: 'Atinge vasul în care ventriculul stâng pompează sângele.', k: ['AO', 'DAO'], v: 'ext' },
];
const NQ = 8;
let exam = null;
const nameOf = k => INFO[k]?.[0] || 'nimic';
function startExam() {
  if (tour) stopTour();
  exam = { order: QUIZ.map((_, i) => i).sort(() => Math.random() - 0.5).slice(0, NQ), i: -1, score: 0, t0: performance.now(), lock: false, done: false };
  select(null); setSize('mare'); nextQ();
}
function stopExam() { exam = null; setHighlight([]); setCaption('', ''); updateLabels(); }
function nextQ() {
  if (!exam) return;
  exam.i++; exam.lock = false; setHighlight([]);
  if (exam.i >= exam.order.length) {
    exam.done = true;
    const sec = Math.round((performance.now() - exam.t0) / 1000), p = exam.score / exam.order.length;
    setCaption(`Rezultat: ${exam.score} / ${exam.order.length}`, `${p >= 0.875 ? 'Excelent!' : p >= 0.6 ? 'Bine!' : 'Mai exersează puțin.'} Timp: ${Math.floor(sec / 60)} min ${sec % 60} s. Din meniu poți relua testul.`);
    tone(660, 0.15); tone(880, 0.15, 'sine', 0.22, 0.15); tone(1320, 0.3, 'sine', 0.22, 0.3);
    return;
  }
  const q = QUIZ[exam.order[exam.i]];
  if (state.view !== q.v) { state.view = q.v; applyView(); }
  setCaption(`Întrebarea ${exam.i + 1} / ${exam.order.length}  ·  scor ${exam.score}`, q.q);
}
function answer(key) {
  if (!exam || exam.lock || exam.done || !key) return;
  const q = QUIZ[exam.order[exam.i]], ok = q.k.includes(key), e = exam;
  e.lock = true;
  if (ok) { e.score++; setHighlight([key], GREEN); tone(880, 0.12); tone(1320, 0.2, 'sine', 0.22, 0.1); hapticAll(0.5, 60); setCaption(`Corect!  ·  scor ${e.score}`, nameOf(key) + '.'); }
  else {
    highlight.clear(); highlight.set(key, RED); for (const k of q.k) highlight.set(k, GREEN); emissiveDirty = true; updateLabels();
    tone(170, 0.28, 'square', 0.1); hapticAll(0.9, 150);
    setCaption(`Greșit  ·  scor ${e.score}`, `Ai atins: ${nameOf(key)} (roșu). Corect: ${nameOf(q.k[0])} (verde).`);
  }
  setTimeout(() => { if (exam === e) nextQ(); }, ok ? 1500 : 3000);
}
function handleClick(key) { if (exam && !exam.done) answer(key); else select(key); }

/* =========================================================
   Interacțiune
   ========================================================= */
const ray = new THREE.Raycaster(), _rm = new THREE.Matrix4();
const VALVE_KEYS = new Set(['TV', 'MV', 'PUV', 'AOV']);
const shown = o => { while (o) { if (!o.visible) return false; o = o.parent; } return true; };
function pickHit() {   // doar la apăsare — nu la fiecare cadru
  const sec = state.view === 'sec';
  const hits = ray.intersectObjects(selectables, false).filter(h => shown(h.object) && !(sec && tissueMats.has(h.object.material) && clipPlane.distanceToPoint(h.point) < 0));
  if (!hits.length) return null;
  const by = f => hits.find(h => f(h.object.userData.key));
  return by(k => VALVE_KEYS.has(k)) || (sec ? by(k => k === 'RV' || k === 'LV') : null) || by(k => k !== 'VW' && k !== 'RV' && k !== 'LV') || hits[0];
}
let grab = null;
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(0, 0, 0), V(0, 0, -1)]), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 }));
  line.scale.z = 2; line.visible = false; c.add(line); c.userData.line = line;
  c.addEventListener('connected', e => { c.userData.src = e.data; line.visible = e.data.targetRayMode === 'tracked-pointer'; c.userData.active = true; });
  c.addEventListener('disconnected', () => { line.visible = false; c.userData.active = false; c.userData.src = null; });
  c.addEventListener('selectstart', () => onSelectStart(c));
  c.addEventListener('selectend', () => onSelectEnd(c));
  c.addEventListener('squeezestart', () => { state.menu = !state.menu; placeUI(false); uiDirty = true; haptic(c, 0.3, 30); });
  scene.add(c); ctrls.push(c);
}
function castFrom(c) { _rm.identity().extractRotation(c.matrixWorld); ray.ray.origin.setFromMatrixPosition(c.matrixWorld); ray.ray.direction.set(0, 0, -1).applyMatrix4(_rm); }
function uiHit() {
  const objs = state.menu ? [hud, menu] : [hud];
  const h = ray.intersectObjects(objs, false)[0]; if (!h) return null;
  return h.object === hud ? { panel: 'hud', X: h.uv.x * HW, Y: (1 - h.uv.y) * HH, d: h.distance } : { panel: 'menu', X: h.uv.x * MW, Y: (1 - h.uv.y) * MH, d: h.distance };
}
function onSelectStart(c) {
  ensureAudio(); castFrom(c);
  const u = uiHit(); if (u) { uiClick(u.panel, u.X, u.Y); haptic(c, 0.25, 20); return; }
  if (grab) return;
  if (secGroup.visible && ray.intersectObject(secHandle, false)[0]) { grab = { c, obj: secGroup, parent: heart }; c.attach(secGroup); haptic(c, 0.4, 25); return; }
  const h = pickHit(); if (!h) return;
  grab = { c, obj: anchor, parent: scene, key: h.object.userData.key, pos: anchor.getWorldPosition(new THREE.Vector3()), quat: anchor.getWorldQuaternion(new THREE.Quaternion()) };
  c.attach(anchor); haptic(c, 0.4, 25);
}
function onSelectEnd(c) {
  if (!grab || grab.c !== c) return;
  grab.parent.attach(grab.obj);
  if (grab.obj === anchor) {
    anchorTarget.copy(anchor.position);
    if (anchor.position.distanceTo(grab.pos) < 0.015 && anchor.quaternion.angleTo(grab.quat) < 0.06) handleClick(grab.key);
  }
  grab = null;
}
function xrHover() {   // ieftin: doar contra celor două panouri
  let hv = null;
  for (const c of ctrls) {
    if (!c.userData.active) continue;
    castFrom(c);
    const u = uiHit();
    if (u) { const i = hitBtn(u.panel === 'hud' ? HB : MB, u.X, u.Y); if (i >= 0) hv = { panel: u.panel, i }; c.userData.line.scale.z = u.d; }
    else c.userData.line.scale.z = 2;
  }
  if ((hv?.panel) !== (hover?.panel) || (hv?.i) !== (hover?.i)) { hover = hv; uiDirty = true; }
}
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; ensureAudio(); });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  handleClick(pickHit()?.object.userData.key ?? null);
});

/* =========================================================
   WebXR
   ========================================================= */
const xrBtn = document.getElementById('xrbtn'), msg = document.getElementById('msg');
let xrMode = null, needPlace = false;
(async () => {
  if (navigator.xr) { try { if (await navigator.xr.isSessionSupported('immersive-ar')) xrMode = 'immersive-ar'; else if (await navigator.xr.isSessionSupported('immersive-vr')) xrMode = 'immersive-vr'; } catch (e) { } }
  if (xrMode) { xrBtn.disabled = false; xrBtn.textContent = xrMode === 'immersive-ar' ? 'Intră în AR' : 'Intră în VR'; }
  else { xrBtn.textContent = 'AR indisponibil'; msg.textContent = 'Previzualizare 3D: rotește cu un deget, mărește cu două degete. Pentru AR, deschide pagina pe Magic Leap 2.'; setTimeout(() => { msg.textContent = ''; }, 8000); }
})();
xrBtn.onclick = async () => {
  ensureAudio();
  try {
    const s = await navigator.xr.requestSession(xrMode, { optionalFeatures: ['local-floor', 'hand-tracking'] });
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(s);
    scene.background = xrMode === 'immersive-ar' ? null : BG;
    renderer.toneMappingExposure = xrMode === 'immersive-ar' ? 1.5 : 1.05;   // pe display-ul aditiv, culorile închise devin transparente
    uiGroup.visible = true; state.menu = false; needPlace = true; curScale = 0.002; uiDirty = true; document.body.classList.add('xr');
    s.addEventListener('end', () => {
      if (grab) { grab.parent.attach(grab.obj); grab = null; }
      scene.background = BG; renderer.toneMappingExposure = 1.05; uiGroup.visible = false; document.body.classList.remove('xr');
      anchorTarget.set(0, 1.5, 0); anchor.position.copy(anchorTarget); anchor.quaternion.identity(); resetView(); uiDirty = true;
    });
  } catch (e) { msg.textContent = 'Nu am putut porni sesiunea XR (' + (e.message || e) + '). Deschide fișierul direct, de pe o adresă HTTPS.'; }
};
resetView();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* =========================================================
   Încărcare model
   ========================================================= */
const bin = Uint8Array.from(atob(window.GLB_B64), c => c.charCodeAt(0)).buffer;
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
loader.parse(bin, '', gltf => { buildModel(gltf); document.getElementById('loading').remove(); }, err => { document.getElementById('loading').textContent = 'Eroare la încărcarea modelului: ' + err.message; });
applyView();

/* =========================================================
   Bucla
   ========================================================= */
const clock = new THREE.Clock();
function sc(key, s) { const g = pivots[key]; if (g) g.scale.setScalar(s); }
function step(dt) {
  const sdt = dt * (state.paused ? 0 : (state.slow ? 0.1 : 1));
  simTime += sdt;
  while (simTime >= cycleStart + cycleDur) { cycleStart += cycleDur; cycleDur = newDur(); beats.push({ s: cycleStart, d: cycleDur }); if (beats.length > 20) beats.shift(); s1Done = s2Done = false; }
  phase = (simTime - cycleStart) / cycleDur;
  if (!s1Done && phase >= 0.19) { s1Done = true; thump(55, 0.14, 0.9); hapticAll(0.7, 70); }
  if (!s2Done && phase >= 0.5) { s2Done = true; thump(85, 0.09, 0.7); hapticAll(0.35, 40); }
  const at = state.afib ? 0 : (phase >= 0.08 && phase < 0.19 ? Math.sin(Math.PI * (phase - 0.08) / 0.11) : 0);
  const tremor = state.afib ? 0.012 * Math.sin(simTime * 2 * Math.PI * 6.1) + 0.008 * Math.sin(simTime * 2 * Math.PI * 8.9 + 1) : 0;
  const ve = smooth(0.19, 0.3, phase) * (1 - smooth(0.46, 0.58, phase));
  const sa = 1 - 0.07 * at + 0.025 * ve + tremor;
  sc('RA', sa); sc('LA', sa); sc('VW', 1 - 0.065 * ve); sc('RV', 1 - 0.18 * ve); sc('LV', 1 - 0.2 * ve);
  SHRINK.value = 0.06 * curScale;
  if (valveGroup.visible) { const ao = avOpen(phase), so = slOpen(phase); for (const v of valves) setValve(v, v.type === 'av' ? lerp(-0.22, 1.3, ao) : lerp(-0.28, 1.4, so)); }
  if (inst.visible) updateParticles(sdt, avOpen(phase) > 0.5, slOpen(phase) > 0.5);
  curScale += (targetScale - curScale) * Math.min(1, dt * 3); heart.scale.setScalar(curScale);
  if (heart.quaternion.angleTo(heartQTarget) > 1e-4) heart.quaternion.slerp(heartQTarget, Math.min(1, dt * 2.5));
  if (!grab || grab.obj !== anchor) anchor.position.lerp(anchorTarget, Math.min(1, dt * (tour ? 1.6 : 3)));
}
let ecgAcc = 1, audioAcc = 1, domAcc = 1, lastHud = '', lastMenu = '';
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  step(dt);
  const xr = xrOn();
  updateEmissive(clock.elapsedTime);
  updateSection(xr);
  if (xr) {
    if (needPlace) { placeInXR(true); placeUI(true); needPlace = false; }
    xrHover(); updateUI(dt);
    menu.visible = state.menu;
    ecgAcc += dt; if (ecgAcc > 1 / 15) { ecgAcc = 0; drawECGTex(); }
    const hs = hudSig(); if (uiDirty || hs !== lastHud) { lastHud = hs; drawHUD(false); }
    const ms = menuSig(); if (state.menu && (uiDirty || ms !== lastMenu)) { lastMenu = ms; drawMenu(); }
    uiDirty = false;
  } else {
    if (camGoal) { const k = Math.min(1, dt * 2.5); controls.target.lerp(camGoal.t, k); camera.position.lerp(camGoal.p, k); }
    controls.update();
    menuC.style.display = state.menu ? '' : 'none';
    domAcc += dt; if (domAcc > 1 / 30) { domAcc = 0; drawHUD(true); if (state.menu) drawMenu(); uiDirty = false; }
  }
  audioAcc += dt; if (audioAcc > 1 / 20) { audioAcc = 0; updateAudio(); }
  renderer.render(scene, camera);
});
</script>
